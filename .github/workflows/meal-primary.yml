name: Meal SQL primary safety
on:
  pull_request:
    paths:
      - 'includes/meal_primary.php'
      - 'includes/database_meals.php'
      - 'includes/database_meal_read.php'
      - 'includes/noitru_store.php'
      - 'includes/noitru_report_stream.php'
      - 'includes/json_store.php'
      - 'includes/json_rows.php'
      - 'includes/json_fields.php'
      - 'database_admin.php'
      - 'tests/meal_primary_mysql_test.php'
      - 'tests/meal_primary_guard_test.php'
      - 'tests/support/meal_history_reference.php'
      - 'includes/noitru_meal_history.php'
      - 'includes/noitru_meal_month_export.php'
      - 'chuyenmon/includes/classroom_home_store.php'
      - 'noitru.php'
      - '.github/workflows/meal-primary.yml'
  workflow_dispatch:
jobs:
  default-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: php tests/meal_primary_guard_test.php
  meal-primary:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        database: ['mysql:8.0', 'mariadb:10.11']
    services:
      mysql:
        image: ${{ matrix.database }}
        env:
          MYSQL_ROOT_PASSWORD: fixture-root-only-password
          MYSQL_DATABASE: cds_disposable_test
          MYSQL_USER: cds_fixture
          MYSQL_PASSWORD: fixture-only-password
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, tokenizer
      - name: Real SQL operations, preservation and reference parity
        env:
          CDS_TEST_MYSQL: disposable-ci
          CDS_TEST_MYSQL_PORT: ${{ job.services.mysql.ports[3306] }}
        run: php tests/meal_primary_mysql_test.php
