name: Illustrated game gallery
on:
  push:
    paths: ['hoclieu.php', 'assets/hoclieu-games.css', 'assets/game-covers/**', 'tests/game_gallery_test.php', '.github/workflows/game-gallery.yml']
  pull_request:
    paths: ['hoclieu.php', 'assets/hoclieu-games.css', 'assets/game-covers/**', 'tests/game_gallery_test.php', '.github/workflows/game-gallery.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - run: php -l hoclieu.php && php tests/game_gallery_test.php && php tests/staff_evaluation_deploy_test.php
