name: Secret doors game
on:
  pull_request:
    paths: ['hoclieu_game_secret*.php', 'assets/cds-secret*', 'assets/secret-audio/**', 'includes/secret_doors.php', 'tests/secret_doors*', '.github/workflows/secret-doors.yml']
  push:
    paths: ['hoclieu_game_secret*.php', 'assets/cds-secret*', 'assets/secret-audio/**', 'includes/secret_doors.php', 'tests/secret_doors*', '.github/workflows/secret-doors.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: fixture-only
          MYSQL_DATABASE: secret_fixture
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pfixture-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      SD_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=secret_fixture;charset=utf8mb4
      SD_TEST_USER: root
      SD_TEST_PASS: fixture-only
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, zip, dom, mbstring
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          php -l hoclieu_game_secret.php
          php -l hoclieu_game_secret_api.php
          php -l includes/secret_doors.php
          php tests/secret_doors_validation_test.php
          php tests/secret_doors_mysql_test.php
          php tests/game_gallery_test.php
          php tests/staff_evaluation_deploy_test.php
          node --check assets/cds-secret.js
          node tests/secret_doors_test.cjs
          node tests/secret_doors_sound_test.cjs
      - run: npm install --prefix "$RUNNER_TEMP/sd-dom" --no-audit --no-fund --ignore-scripts jsdom@26.1.0
      - run: NODE_PATH="$RUNNER_TEMP/sd-dom/node_modules" node tests/secret_doors_client_test.cjs
