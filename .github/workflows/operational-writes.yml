name: Operational write regressions
on:
  pull_request:
    paths:
      - 'includes/json_store.php'
      - 'includes/noitru_store.php'
      - 'includes/noitru_meal_history.php'
      - 'chuyenmon/includes/lesson_book_store.php'
      - 'noitru.php'
      - 'tests/operational_writes_test.php'
      - 'tests/weekly_review_year_test.php'
      - 'tests/support/load_functions.php'
      - '.github/workflows/operational-writes.yml'
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Syntax
        run: |
          php -l includes/json_store.php
          php -l includes/noitru_store.php
          php -l includes/noitru_meal_history.php
          php -l chuyenmon/includes/lesson_book_store.php
          php -l noitru.php
          php -l tests/operational_writes_test.php
          php -l tests/weekly_review_year_test.php
          php -l tests/support/load_functions.php
      - name: Data preservation and competing writes
        run: |
          php tests/operational_writes_test.php
          php tests/weekly_review_year_test.php
          php tests/lesson_book_manual_test.php
