name: GDĐP program assignments
on:
  pull_request:
    paths:
      - 'includes/program*'
      - 'tkb_publish.php'
      - 'chuyenmon/thoikhoabieu.php'
      - 'chuyenmon/tkb_substitution_manage.php'
      - 'chuyenmon/includes/footer.php'
      - 'tests/program_extra_teacher*'
      - 'tkb_editor.php'
      - 'assets/timetable-warnings.css'
      - 'assets/timetable-publish-review.js'
      - 'includes/pccm_release.php'
      - 'includes/timetable_builder.php'
      - 'tkb_xep.php'
      - 'chuyenmon/them.php'
      - 'chuyenmon/includes/program*'
      - 'chuyenmon/program_assignment_template.php'
      - 'chuyenmon/includes/functions.php'
      - 'chuyenmon/includes/lesson_book_store.php'
      - 'chuyenmon/includes/lesson_book_sign_validation.php'
      - 'tests/program_assignment*'
      - 'tests/program_lesson_book_test.php'
      - 'tests/program_flexible_sign_test.php'
      - 'tests/program_publish_review*'
      - '.github/workflows/program-assignment.yml'
  workflow_dispatch:
jobs:
  program:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, zip, dom
      - run: |
          for f in includes/program*.php chuyenmon/includes/program*.php includes/timetable_builder.php tkb_xep.php chuyenmon/them.php chuyenmon/includes/functions.php chuyenmon/includes/lesson_book_store.php chuyenmon/includes/lesson_book_sign_validation.php; do php -l "$f" || exit 1; done
          php tests/program_assignment_test.php
          php tests/program_assignment_controller_test.php
          php tests/program_assignment_excel_test.php
          php tests/program_lesson_book_test.php
          php tests/program_flexible_sign_test.php
          php -l chuyenmon/thoikhoabieu.php
          php -l chuyenmon/tkb_substitution_manage.php
          php -l chuyenmon/includes/footer.php
          php tests/program_extra_teacher_test.php
          php -l tkb_publish.php
          php -l tkb_editor.php
          php tests/program_publish_review_test.php
          php tests/timetable_workspace_copy_test.php
          php tests/lesson_book_sign_validation_test.php
          php tests/lesson_book_sign_performance_test.php
  input-browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, zip, dom
      - run: php tests/program_assignment_browser_fixture.php --empty-error
      - run: npm install --prefix "$RUNNER_TEMP/gdp" --no-package-lock playwright@1.58.2 bootstrap@5.3.3
      - run: "$RUNNER_TEMP/gdp/node_modules/.bin/playwright install chromium"
      - run: node tests/program_assignment_browser.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/gdp/node_modules

      - run: node tests/program_assignment_excel_browser.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/gdp/node_modules


  review-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring
      - run: npm install --prefix "$RUNNER_TEMP/review-ui" --no-package-lock jsdom@26.1.0
      - run: node --check assets/timetable-publish-review.js && node tests/program_publish_review_dom.cjs && node tests/program_extra_teacher_ui.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/review-ui/node_modules
