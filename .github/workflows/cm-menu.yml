name: Academic navigation
on:
  pull_request:
    paths:
      - 'chuyenmon/includes/header.php'
      - 'chuyenmon/kehoach.php'
      - 'chuyenmon/tongquan.php'
      - 'chuyenmon/ketqua.php'
      - 'chuyenmon/includes/pccm_workflow_view.php'
      - 'chuyenmon/assets/pccm-workflow.css'
      - 'chuyenmon/assets/pccm-input.css'
      - 'chuyenmon/monhoc.php'
      - 'chuyenmon/kiemnhiem.php'
      - 'chuyenmon/assets/pccm-overview.css'
      - 'includes/chuyenmon_responsive_layout.php'
      - 'chuyenmon/includes/cds_responsive_layout.php'
      - 'tests/cm_menu*'
      - '.github/workflows/cm-menu.yml'
  workflow_dispatch:
jobs:
  menu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
      - name: Original PCCM page
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: git show "$BASE_SHA:chuyenmon/ketqua.php" > "$RUNNER_TEMP/pccm-before.php"
      - run: |
          php -l chuyenmon/includes/header.php
          php -l chuyenmon/kehoach.php
          php -l chuyenmon/monhoc.php
          php -l chuyenmon/includes/cds_responsive_layout.php
          php tests/cm_menu_test.php
          CDS_PCCM_BASELINE="$RUNNER_TEMP/pccm-before.php" php tests/cm_menu_pccm_test.php
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring
      - run: php tests/cm_menu_test.php --html && php tests/cm_menu_pccm_test.php
      - run: npm install --prefix "$RUNNER_TEMP/cm-menu" --no-package-lock playwright@1.58.2 bootstrap@5.3.3
      - run: "$RUNNER_TEMP/cm-menu/node_modules/.bin/playwright install --with-deps chromium"
      - run: node tests/cm_menu_browser.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/cm-menu/node_modules
