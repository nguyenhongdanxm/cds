name: Buzzer game safety
on:
  pull_request:
    paths:
      - 'hoclieu.php'
      - 'hoclieu_game_buzzer*.php'
      - 'includes/buzzer*.php'
      - 'assets/buzzer.*'
      - 'tests/buzzer*'
      - 'tests/support/buzzer*'
      - 'tools/deploy_cds.php'
      - '.github/workflows/buzzer.yml'
  workflow_dispatch:
jobs:
  game:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
      - run: |
          php -l hoclieu.php
          php -l hoclieu_game_buzzer.php
          php -l hoclieu_game_buzzer_api.php
          php -l includes/buzzer_game.php
          php -l includes/buzzer_store.php
          php -l includes/buzzer_access.php
          php -l tools/deploy_cds.php
          php tests/buzzer_game_test.php
          node --check assets/buzzer.js
  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        database: ['mysql:8.0', 'mariadb:10.11']
    services:
      mysql:
        image: ${{ matrix.database }}
        env:
          MYSQL_ROOT_PASSWORD: fixture-root-only-password
          MYSQL_DATABASE: cds_disposable_test
          MYSQL_USER: cds_fixture
          MYSQL_PASSWORD: fixture-only-password
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql
      - run: php tests/buzzer_mysql_test.php
        env:
          CDS_TEST_MYSQL: disposable-ci
          CDS_TEST_MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring
      - run: npm install --prefix "$RUNNER_TEMP/buzzer-browser" --no-package-lock playwright@1.58.2
      - run: "$RUNNER_TEMP/buzzer-browser/node_modules/.bin/playwright install --with-deps chromium"
      - run: node tests/buzzer_browser_test.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/buzzer-browser/node_modules
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: buzzer-screenshots
          path: /tmp/buzzer-screenshots
