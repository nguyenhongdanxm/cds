name: Staff monthly evaluation
on:
  pull_request:
    paths:
      - 'tools/deploy_cds.php'
      - 'includes/staff_evaluation.php'
      - 'thidua_danhgia.php'
      - 'assets/staff-evaluation.css'
      - 'tests/staff_evaluation*'
      - 'tests/support/staff_evaluation_fixture.php'
      - '.github/workflows/staff-evaluation.yml'
  workflow_dispatch:
jobs:
  staff-safety:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pcntl
      - run: |
          php -l includes/staff_evaluation.php
          php -l thidua_danhgia.php
          php tests/staff_evaluation_test.php
          php tests/staff_evaluation_deploy_test.php
          php tests/viewer_access_test.php
  staff-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring
      - run: npm install --prefix "$RUNNER_TEMP/staff-browser" --no-package-lock playwright@1.58.2
      - run: "$RUNNER_TEMP/staff-browser/node_modules/.bin/playwright install --with-deps chromium"
      - run: node tests/staff_evaluation_browser.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/staff-browser/node_modules
