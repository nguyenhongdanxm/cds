name: Student card selection
on:
  pull_request:
    paths:
      - 'csdl_student_cards.php'
      - 'tests/student_cards_selection_browser.cjs'
      - 'tests/support/student_cards_selection_fixture.php'
      - '.github/workflows/student-card-selection.yml'
  workflow_dispatch:
jobs:
  selection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: php -l csdl_student_cards.php
      - run: npm install --prefix "$RUNNER_TEMP/cards-browser" --no-package-lock playwright@1.58.2
      - run: "$RUNNER_TEMP/cards-browser/node_modules/.bin/playwright install --with-deps chromium"
      - run: node tests/student_cards_selection_browser.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/cards-browser/node_modules
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: student-card-selection
          path: /tmp/student-card-selection
