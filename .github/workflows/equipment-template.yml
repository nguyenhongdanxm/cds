name: Populated equipment template
on:
  pull_request:
    paths:
      - 'thuvien.php'
      - 'thietbi_mau.php'
      - 'includes/library_equipment_template.php'
      - 'tests/equipment_template_test.php'
      - 'assets/mau-nhap-danh-muc-thiet-bi.xlsx'
      - '.github/workflows/equipment-template.yml'
  workflow_dispatch:
jobs:
  template:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, zip, dom
      - run: |
          php -l thuvien.php
          php -l thietbi_mau.php
          php -l includes/library_equipment_template.php
          php tests/equipment_template_test.php
