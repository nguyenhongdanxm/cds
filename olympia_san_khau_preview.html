<script>
const sceneNames={khoi_dong:'KHỞI ĐỘNG',vuot_chuong_ngai_vat:'VƯỢT CHƯỚNG NGẠI VẬT',tang_toc:'TĂNG TỐC',ve_dich:'VỀ ĐÍCH'};
const assetNames={logo:'Logo cuộc thi',welcome:'Nhạc chào mừng',khoi_dong:'Nhạc Khởi động',vuot_chuong_ngai_vat:'Nhạc Vượt chướng ngại vật',tang_toc:'Nhạc Tăng tốc',ve_dich:'Nhạc Về đích',question:'Tín hiệu mở câu hỏi',countdown:'Tín hiệu đếm giờ',end:'Tín hiệu hết giờ',correct:'Tín hiệu trả lời đúng',wrong:'Tín hiệu trả lời sai',reveal:'Tín hiệu công bố đáp án',bell:'Tín hiệu bấm chuông',score:'Tín hiệu công bố điểm',star:'Tín hiệu Ngôi sao hy vọng'};
let scene='khoi_dong',showAnswer=false,playing=null,startMode='private',intro=false,obstacleView='board',speedView='question',finishView='pack',buzzed=false,pack=[20,20,20],starUsed=false,speedQuestion=0;const files={},portraits={};const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const people=[['THÍ SINH 01','12A1',100],['THÍ SINH 02','12A2',90],['THÍ SINH 03','11A1',110],['THÍ SINH 04','11A2',80]];
function portrait(i){return portraits[i]?`<img class="portrait" src="${portraits[i]}" alt="Ảnh thí sinh ${i+1}">`:''}function render(){document.querySelectorAll('[data-scene]').forEach(b=>b.classList.toggle('active',b.dataset.scene===scene));$('stage').className='stage '+(intro?'intro':({vuot_chuong_ngai_vat:'obstacle',tang_toc:'speed',ve_dich:'finish'}[scene]||'start'));$('round').textContent=sceneNames[scene];$('timer').textContent=({khoi_dong:'03',vuot_chuong_ngai_vat:'15',tang_toc:String([20,20,30,30][speedQuestion]),ve_dich:String(pack[0]===20?15:20)})[scene];$('modeBtn').classList.toggle('hidden',scene!=='khoi_dong');$('modeBtn').textContent=startMode==='private'?'Lượt chung':'Lượt riêng';$('introBtn').textContent=intro?'Cảnh câu hỏi':'Cảnh mở vòng';$('obstacleBtn').classList.toggle('hidden',scene!=='vuot_chuong_ngai_vat');$('obstacleBtn').textContent=({board:'Cảnh đáp án',answers:'Cảnh hình ảnh',media:'Cảnh bảng ô chữ'})[obstacleView];$('speedBtn').classList.toggle('hidden',scene!=='tang_toc');$('speedBtn').textContent=({question:'Cảnh kết quả',results:'Cảnh câu hỏi hình'})[speedView];$('finishBtn').classList.toggle('hidden',scene!=='ve_dich');$('starBtn').classList.toggle('hidden',scene!=='ve_dich'||finishView==='pack');$('starBtn').textContent=starUsed?'★ Đã đặt Ngôi sao':'Đặt Ngôi sao hy vọng';$('speedNext').classList.toggle('hidden',scene!=='tang_toc');$('speedNext').textContent=`Câu ${speedQuestion+1}/4 · ${[20,20,30,30][speedQuestion]}s → tiếp`;$('finishBtn').textContent=({pack:'Cảnh câu hỏi',question:'Cảnh Ngôi sao',star:'Cảnh chọn gói'})[finishView];$('scores').innerHTML=people.map((p,i)=>`<div class="score">${portrait(i)}<b>${esc(p[0])}</b><small>${esc(p[1])}</small><strong>${p[2]}</strong></div>`).join('');let h='';if(intro){$('content').innerHTML=`<div class="laurel">❧　⛰　❧</div><div class="intro-title">${esc(sceneNames[scene])}</div><div class="intro-caption">ĐƯỜNG LÊN ĐỈNH OLYMPIA</div><div class="intro-people">${people.map((p,i)=>`<div>${portrait(i)}<b>${esc(p[0])}</b></div>`).join('')}</div>`;return}
if(scene==='khoi_dong')h=`<div class="camera-preview"><div class="diamond">◇</div><div class="camera-label">${portrait(0)}HÌNH ẢNH THÍ SINH / SÂN KHẤU</div><div class="camera-note">Nguồn camera trực tiếp khi vận hành</div></div><div class="question-bar"><div class="start-score-strip">${people.map((p,i)=>`<span class="${startMode==='private'&&i===0?'active':''}">${i+1}. ${esc(p[0])}<b>${p[2]}</b></span>`).join('')}</div><div class="start-question">${startMode==='private'?'Tại vùng cực, vào mùa đông, Mặt Trời không bao giờ mọc trong suốt nhiều tháng liền. Hiện tượng này được gọi là gì?':'Ascorbic acid là tên khoa học của loại vitamin nào?'}${showAnswer?'<div class="start-answer">ĐÁP ÁN: '+(startMode==='private'?'Đêm địa cực':'Vitamin C')+'</div>':''}</div></div>${buzzed?'<div class="buzz-overlay">🔔 THÍ SINH 02 GIÀNH QUYỀN</div>':''}<div class="mode-caption">${startMode==='private'?'LƯỢT RIÊNG · THÍ SINH 01 · CÂU 01/06':'LƯỢT CHUNG · CÂU 01/12 · BẤM CHUÔNG GIÀNH QUYỀN'}</div>`;
if(scene==='vuot_chuong_ngai_vat'){
if(obstacleView==='answers')h=`<div class="obstacle-results">${people.map((p,i)=>`<div class="result-row"><span>${esc(p[0])}</span><b>${showAnswer?'ĐỒNG SƠN':'ĐÃ GỬI ĐÁP ÁN'}</b></div>`).join('')}</div>`;
else if(obstacleView==='media')h=`<div class="media-question panel"><div class="media-prompt">Hãy sắp xếp các bảo vật quốc gia sau với tên gọi tương ứng.</div><div class="media-items">${['A','B','C','D'].map((x,i)=>`<div><div class="object-placeholder">ẢNH ${i+1}</div><b>${x}</b></div>`).join('')}</div><div class="media-caption">Vùng ảnh, âm thanh hoặc video do người quản trị nạp cho câu hỏi</div></div><div class="camera-inset panel">HÌNH SÂN KHẤU TRỰC TIẾP</div>`;
else {let words=showAnswer?['○ ○ ○ ○ ○ ○ ○ ○ ○','○ ○ ○ ○ ○ ○ ○ ○ ○','Đ Ồ N G S Ơ N','○ ○ ○']:['○ ○ ○ ○ ○ ○ ○ ○ ○','○ ○ ○ ○ ○ ○ ○ ○ ○','○ ○ ○ ○ ○ ○ ○','○ ○ ○'];h=`<div class="panel puzzle-image">${[1,2,4,3].map(n=>`<div class="puzzle-piece ${showAnswer&&n===3?'revealed':''}">${showAnswer&&n===3?'MẢNH 3':n}</div>`).join('')}<div class="center-piece"></div></div><div class="panel puzzle-words"><div class="puzzle-heading">CHƯỚNG NGẠI VẬT CÓ 7 CHỮ CÁI</div>${words.map((w,i)=>`<div class="word-row ${showAnswer&&i===2?'solved':''}">${w.split(' ').map(c=>`<span class="letter">${c}</span>`).join('')}<span class="word-number">${i+1}</span></div>`).join('')}</div><div class="panel clue">${showAnswer?'Từ nào còn thiếu trong đoạn bài hát sau?':'Công cuộc nghiên cứu khảo cổ học đã xác định được rõ ràng văn hóa ... là nền văn hóa thuộc sơ kỳ thời đại đồ sắt.'}<small>00:15 · Câu hỏi hàng ngang</small></div><div class="panel camera">${people.map(p=>`<div class="mini-person" data-name="${esc(p[0])}"></div>`).join('')}</div>`}}

if(scene==='tang_toc')h=speedView==='results'?`<div class="speed-results"><div class="speed-results-heading">CÂU ${speedQuestion+1}/4 · ${[20,20,30,30][speedQuestion]} GIÂY · ĐÁP ÁN ĐÚNG: A · C · E ${showAnswer?'· ĐÃ CHẤM VÀ CÔNG BỐ ĐIỂM':'· CHỜ GIÁM KHẢO XÁC NHẬN'}</div>${[[0,'ACE','1.29',40],[1,'ABE','3.65',0],[2,'ACE','7.18',30],[3,'ACE','12.47',20]].map(([i,answer,time,point])=>`<div class="speed-result ${answer==='ACE'?'correct':'incorrect'}"><strong>${portrait(i)}${esc(people[i][0])}</strong><b>${answer}</b><em>${time}s</em><span>${showAnswer?(answer==='ACE'?'+'+point:'0'):'—'}</span></div>`).join('')}<div class="speed-rule">Chỉ đáp án đúng được xếp theo thời điểm máy chủ nhận. Cùng thời điểm hợp lệ: cùng mức điểm theo luật.</div></div>`:`<div class="speed-question panel"><div class="speed-prompt">CÂU ${speedQuestion+1}/4 · ${[20,20,30,30][speedQuestion]} GIÂY<br>${showAnswer?'Đây là ai?':'Những quốc gia nào sau đây cùng nằm ở một châu lục?'}</div><div class="speed-media panel">${showAnswer?'<div class="sample-visual">HÌNH ẢNH / VIDEO CÂU HỎI</div>':`<div class="flag-grid">${[['🇲🇽','A'],['🇿🇦','B'],['🇪🇨','C'],['🇮🇳','D'],['🇨🇺','E'],['🇩🇰','F']].map(([flag,label])=>`<div><div>${flag}</div><b>${label}</b></div>`).join('')}</div>`}</div><div class="speed-camera panel">CAMERA SÂN KHẤU</div></div>`;
if(scene==='ve_dich')h=finishView==='pack'?`<div class="finish-camera"><div class="diamond">◇</div><span>${portrait(2)}CAMERA THÍ SINH ĐANG CHỌN GÓI</span></div><div class="finish-pack"><div class="finish-pack-top">${[20,20,20].map((n,i)=>`<span class="${pack[i]===20?'chosen':''}" data-pack="${i}:20">${n}</span>`).join('')}</div><div class="finish-pack-bottom">${[30,30,30].map((n,i)=>`<span class="${pack[i]===30?'chosen':''}" data-pack="${i}:30">${n}</span>`).join('')}</div></div><div class="pack-total">GÓI ĐÃ CHỌN: ${pack.join(' – ')} · TỔNG ${pack.reduce((a,b)=>a+b,0)} ĐIỂM</div>`:`<div class="finish-camera"><div class="diamond">◇</div><span>${portrait(2)}CAMERA THÍ SINH ĐANG THI</span></div><div class="finish-question-bar"><div class="finish-score-strip">${people.map((p,i)=>`<span class="${i===2?'active':''}">${esc(p[0])} (${p[2]})</span>`).join('')}</div><div class="finish-question">${buzzed?'<div class="finish-buzzer">🔔 THÍ SINH 01 GIÀNH QUYỀN</div>':''}${finishView==='star'?'NGÔI SAO HY VỌNG ★ · '+(starUsed?'ĐÃ ĐẶT':'CHƯA ĐẶT'): 'Theo báo cáo mới công bố, hai quốc gia nào có mức độ ứng dụng AI cao nhất khu vực Đông Nam Á?'}${showAnswer?'<div class="start-answer">ĐÁP ÁN: Nội dung do giám khảo xác nhận</div>':''}</div><div class="finish-point">${starUsed?'★':''}${pack[0]}<small>${pack.join(' / ')}</small></div></div>`;
$('content').innerHTML=h;document.querySelectorAll('[data-pack]').forEach(el=>el.onclick=()=>{const [i,value]=el.dataset.pack.split(':').map(Number);pack[i]=value;render()})}
function play(key){if(playing){playing.pause();playing.currentTime=0}if(!files[key])return;playing=new Audio(files[key]);playing.play().catch(()=>{});}document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{scene=b.dataset.scene;showAnswer=false;intro=false;buzzed=false;obstacleView='board',speedView='question',finishView='pack';render();play(scene)});$('introBtn').onclick=()=>{intro=!intro;render();if(intro)play('welcome')};$('finishBtn').onclick=()=>{finishView=({pack:'question',question:'star',star:'pack'})[finishView];showAnswer=false;render()};$('starBtn').onclick=()=>{if(showAnswer||starUsed)return;starUsed=true;finishView='star';render();play('star')};$('speedNext').onclick=()=>{speedQuestion=(speedQuestion+1)%4;speedView='question';showAnswer=false;render()};$('speedBtn').onclick=()=>{speedView=speedView==='question'?'results':'question';showAnswer=false;render()};$('obstacleBtn').onclick=()=>{obstacleView=({board:'answers',answers:'media',media:'board'})[obstacleView];render()};$('modeBtn').onclick=()=>{startMode=startMode==='private'?'common':'private';showAnswer=false;intro=false;render()};$('buzzBtn').onclick=()=>{buzzed=!buzzed;render();if(buzzed)play('bell')};$('answerBtn').onclick=()=>{showAnswer=!showAnswer;render();play(showAnswer?'reveal':'question')};$('soundBtn').onclick=()=>play('end');$('fullBtn').onclick=()=>document.fullscreenElement?document.exitFullscreen():$('stage').requestFullscreen();$('settingsBtn').onclick=()=>$('settings').classList.toggle('hidden');
$('assets').innerHTML='<h3>Ảnh đại diện 4 thí sinh</h3><div class="portrait-inputs">'+people.map((p,i)=>`<label>${esc(p[0])}<input type="file" data-portrait="${i}" accept="image/png,image/jpeg,image/webp"></label>`).join('')+'</div><h3>Logo và nhạc tín hiệu</h3>'+Object.entries(assetNames).map(([key,name])=>`<label>${esc(name)}<input type="file" data-key="${key}" accept="${key==='logo'?'image/png,image/jpeg,image/webp':'audio/mpeg,audio/ogg,audio/wav'}"></label>`).join('');$('assets').onchange=e=>{const input=e.target;if(!input.files?.[0])return;if(input.dataset.portrait!==undefined){const i=Number(input.dataset.portrait);if(portraits[i])URL.revokeObjectURL(portraits[i]);portraits[i]=URL.createObjectURL(input.files[0]);render();return}if(!input.dataset.key)return;const key=input.dataset.key;if(files[key])URL.revokeObjectURL(files[key]);files[key]=URL.createObjectURL(input.files[0]);if(key==='logo')$('logo').src=files.logo;};
$('logo').src='assets/olympia-year-3.png';render();
</script></body></html>
